name: Code Quality & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install linting and formatting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy pyyaml

      - name: Check code formatting with Black
        run: |
          black --check --diff src scripts tests configs

      - name: Check import ordering with isort
        run: |
          isort --check --diff --profile black src scripts tests

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length set to 100
          flake8 src scripts tests --count --exit-zero --max-complexity=15 --max-line-length=100 --statistics

      - name: Run type checking with mypy
        run: |
          mypy src --ignore-missing-imports --no-strict-optional
