models:
  classical:
    logistic_regression:
      penalty: "l2"
      C: 1.0
      solver: "lbfgs"
      max_iter: 1000
      class_weight: "balanced"
      random_state: 42

    random_forest:
      n_estimators: 150
      max_depth: 8
      min_samples_split: 4
      min_samples_leaf: 2
      max_features: "sqrt"
      class_weight: "balanced"
      n_jobs: -1
      random_state: 42

    gradient_boosting:
      learning_rate: 0.05
      n_estimators: 150
      max_depth: 4
      subsample: 0.85
      random_state: 42

    svm:
      C: 1.0
      kernel: "rbf"
      gamma: "scale"
      probability: true
      max_iter: 2000
      random_state: 42

  deep_learning:
    tabular_mlp:
      hidden_dims: [64, 32]
      dropout_rates: [0.2, 0.1]
      activation: "relu"
      use_batch_norm: true
      use_residual: false
      output_dim: 2

  ensemble:
    voting:
      voting: "soft"
      estimators: ["random_forest", "gradient_boosting", "logistic_regression"]
      weights: [0.4, 0.4, 0.2]
