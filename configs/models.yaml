models:
  classical:
    logistic_regression:
      penalty: "l2"
      C: 1.0
      solver: "lbfgs"
      max_iter: 1000
      class_weight: "balanced"
      random_state: 42

    random_forest:
      n_estimators: 200
      max_depth: 15
      min_samples_split: 4
      min_samples_leaf: 2
      max_features: "sqrt"
      class_weight: "balanced_subsample"
      n_jobs: -1
      random_state: 42

    gradient_boosting:
      learning_rate: 0.05
      n_estimators: 300
      max_depth: 6
      subsample: 0.85
      colsample_bytree: 0.85
      random_state: 42

    svm:
      C: 1.0
      kernel: "rbf"
      gamma: "scale"
      probability: true
      max_iter: 2000
      random_state: 42

  deep_learning:
    tabular_mlp:
      input_dim: 28
      hidden_dims: [128, 64, 32]
      dropout: 0.25
      use_batch_norm: true
      activation: "relu"
      output_dim: 2

    tabular_resnet:
      input_dim: 28
      hidden_dim: 128
      num_blocks: 4
      dropout: 0.2
      output_dim: 2

    temporal_lstm:
      input_dim: 28
      hidden_dim: 64
      num_layers: 2
      bidirectional: true
      dropout: 0.2
      output_dim: 2

  ensemble:
    voting:
      voting: "soft"
      weights: [0.35, 0.40, 0.25] # RF, GBDT, Tabular MLP
    stacking:
      meta_classifier: "logistic_regression"
      use_probabilities: true

  explainability:
    shap:
      background_samples: 100
      max_evals: 500
    permutation_importance:
      n_repeats: 10
      scoring: "roc_auc"
