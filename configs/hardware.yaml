hardware:
  preferred_device: "auto" # auto, mps, cuda, cpu
  fallback_device: "cpu"
  allow_tf32: true
  benchmark_cudnn: true

memory:
  max_ram_fraction: 0.80
  max_gpu_fraction: 0.85
  enable_garbage_collection: true
  empty_cache_frequency: 10 # steps

concurrency:
  num_threads: 4
  torch_num_threads: 2
  dataloader_workers: 0

monitoring:
  sample_interval_seconds: 5
  track_ram: true
  track_vram: true
  log_device_info: true
