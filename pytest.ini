[pytest]
minversion = 7.0
addopts = -ra -q --verbose
pythonpath = src
testpaths =
    tests
python_files =
    test_*.py
python_classes =
    Test*
python_functions =
    test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    hardware: tests requiring GPU/MPS hardware
    integration: integration tests between modules
